name: Build IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Decode app icon if needed
        run: |
          set -euo pipefail
          ICON="Cove/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
          if [ ! -f "$ICON" ]; then
            base64 -D -i AppIcon.png.b64 -o "$ICON"
          fi

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          DERIVED="$(pwd)/build/DerivedData"
          ARCHIVE="$(pwd)/build/Cove.xcarchive"
          mkdir -p "$DERIVED"

          xcodebuild archive \
            -project Cove.xcodeproj \
            -scheme Cove \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

          APP_PATH=$(find "$ARCHIVE/Products/Applications" -name "*.app" -maxdepth 1 | head -1)
          test -n "$APP_PATH"
          IPA_DIR="$(pwd)/build/ipa_payload"
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          (cd "$IPA_DIR" && zip -r -y "../Cove.ipa" Payload)
          ls -lh "$(pwd)/build/Cove.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cove
          path: build/Cove.ipa
          if-no-files-found: error

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          draft: true
          files: build/Cove.ipa
          body: |
            Unsigned IPA. Sign Cove.ipa with RustSign, same as HouseArrest.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
